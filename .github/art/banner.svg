<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Xelqun Forms: a PHP field definition rendered as a form">
  <defs>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0" stop-color="#414fd2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#414fd2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f4f5f8" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="812" x2="866" y1="200" y2="200">
      <stop offset="0" stop-color="#778ffa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#778ffa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="#0e0f13"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <!-- Wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="68" y="172" fill="#f4f5f8" font-size="56" font-weight="700" letter-spacing="-1.5">Xelqun</text>
    <text x="68" y="232" fill="#778ffa" font-size="56" font-weight="700" letter-spacing="-1.5">Forms</text>
    <text x="70" y="276" fill="#aeb3c2" font-size="20">Write it in PHP. Render it in Vue.</text>
  </g>

  <!-- PHP definition -->
  <g filter="url(#shadow)">
    <rect x="432" y="104" width="372" height="192" rx="14" fill="#171922" stroke="#2b2f3d"/>
  </g>
  <g fill="#3a3f50">
    <circle cx="456" cy="128" r="5"/>
    <circle cx="474" cy="128" r="5"/>
    <circle cx="492" cy="128" r="5"/>
  </g>
  <text x="780" y="133" text-anchor="end" fill="#7d8396" font-family="Menlo, Monaco, monospace" font-size="13">OrderForm.php</text>
  <g font-family="Menlo, Monaco, monospace" font-size="19">
    <text x="456" y="182"><tspan fill="#778ffa">TextInput</tspan><tspan fill="#aeb3c2">::</tspan><tspan fill="#f4f5f8">make</tspan><tspan fill="#aeb3c2">(</tspan><tspan fill="#8fd6b4">'email'</tspan><tspan fill="#aeb3c2">)</tspan></text>
    <text x="484" y="216"><tspan fill="#aeb3c2">-&gt;</tspan><tspan fill="#f4f5f8">label</tspan><tspan fill="#aeb3c2">(</tspan><tspan fill="#8fd6b4">'Email'</tspan><tspan fill="#aeb3c2">)</tspan></text>
    <text x="484" y="250"><tspan fill="#aeb3c2">-&gt;</tspan><tspan fill="#f4f5f8">required</tspan><tspan fill="#aeb3c2">(),</tspan></text>
  </g>

  <!-- Flow from definition to rendered form -->
  <path d="M812 200 H862" fill="none" stroke="url(#link)" stroke-width="3" stroke-linecap="round"/>
  <path d="M858 191 L868 200 L858 209" fill="none" stroke="#778ffa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rendered form -->
  <g filter="url(#shadow)">
    <rect x="880" y="88" width="332" height="224" rx="14" fill="#f4f5f8"/>
  </g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="908" y="134" fill="#1a1b23" font-size="17" font-weight="600">Email <tspan fill="#d0344a">*</tspan></text>
    <rect x="905" y="148" width="282" height="52" rx="11" fill="none" stroke="#778ffa" stroke-opacity="0.45" stroke-width="4"/>
    <rect x="908" y="151" width="276" height="46" rx="9" fill="#ffffff" stroke="#414fd2" stroke-width="1.5"/>
    <text x="924" y="180" fill="#1a1b23" font-size="17">you@example.com</text>
    <rect x="1071" y="163" width="1.6" height="22" fill="#414fd2"/>
    <rect x="1084" y="228" width="100" height="48" rx="9" fill="#414fd2"/>
    <text x="1134" y="258" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Save</text>
  </g>
</svg>
